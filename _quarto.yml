project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/"
    - "rooms/"

website:
  title: "Stuart Lee"
  description: "A digital garden"
  site-url: https://stuartlee.org

  navbar:
    left:
      - text: About
        href: about.qmd
      - text: Writing
        href: posts.qmd
      - text: Publications
        href: publications.qmd
    right:
      - icon: github
        href: https://github.com/sa-lee
      - icon: envelope
        href: contact.qmd

  page-footer:
    center: "© 2017-2026 Stuart Lee"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: true

execute:
  freeze: auto
