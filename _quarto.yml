project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/"

website:
  title: "Stuart Lee"
  description: "Personal website of Stuart Lee - data science, visualization, and software"
  site-url: https://stuartlee.org

  navbar:
    left:
      - text: About
        href: about.qmd
      - text: Writing
        href: posts.qmd
      - text: Publications
        href: publications.qmd
      - text: CV
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/sa-lee
      - icon: envelope
        href: contact.qmd

  page-footer:
    center: "© 2017-2026 Stuart Lee"

format:
  html:
    theme:
      light: cosmo
    css: styles.scss
    toc: true

execute:
  freeze: auto
